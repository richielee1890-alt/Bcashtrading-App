<title>Bcash Trading</title>
<style>
:root{color-scheme:dark;--bg:#000;--bg2:#0b0b0d;--card:#111114;--bd:#25252b;--tx:#f5f5f7;--mu:#8e8e99;--ac:#f2c14e;--ac2:#c8921a;--red:#ff5470;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(700px 420px at 90% -5%,#f2c14e22,transparent),radial-gradient(600px 400px at -10% 30%,#c8921a14,transparent),var(--bg);color:var(--tx);min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:var(--tx);background:none}
#app{max-width:520px;margin:auto;padding:16px 16px 96px}
h2{margin:6px 0 12px}h3{margin:20px 0 8px;font-size:15px;color:var(--mu);font-weight:600}.mu{color:var(--mu)}small{color:var(--mu)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sp{flex:1}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#1a1200;font-weight:800;padding:13px 18px;border-radius:14px;box-shadow:0 8px 24px #f2c14e33;transition:.15s;width:100%;margin-top:10px}
.btn:hover{transform:translateY(-2px)}.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}.btn:disabled{opacity:.4}
.ib{background:var(--card);border:1px solid var(--bd);border-radius:12px;width:42px;height:42px;font-size:18px}
.bc{border-radius:24px;padding:22px;background:linear-gradient(135deg,#1c1403,#7d5a0d 55%,#c99a1e);color:#fff;border:1px solid #f2c14e66;box-shadow:0 16px 40px #f2c14e25}
.bc small{color:#ffffffd0}.bg{font-size:36px;font-weight:900;margin:4px 0;letter-spacing:-1px}.eye{font-size:15px;color:inherit}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.qa button{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 4px;font-size:12px;font-weight:600}.qa span{display:block;font-size:22px;margin-bottom:4px}
.pn{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:6px 14px}
.cr{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}.cr:last-child{border:0}
.ci{width:38px;height:38px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:18px;font-weight:800;color:var(--ac)}
.up{color:#2ee6a6}.dn{color:var(--red)}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.gt{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 4px;gap:6px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}.gt span{font-size:26px}.gt.on{border-color:var(--ac);box-shadow:0 0 0 2px #f2c14e44}
.chp{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px}.chp.on,.seg .on{background:var(--ac);color:#1a1200}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:4px;margin:10px 0}.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;color:var(--mu)}.seg .on{color:#1a1200}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px;font-weight:600}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font:inherit}
input:focus,select:focus{outline:2px solid var(--ac);border-color:transparent}
.pay{background:var(--bg2);border-radius:14px;padding:14px;margin-top:12px;text-align:center}.pay b{font-size:24px;color:var(--ac)}
.tx{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}.tx:last-child{border:0}.ti{width:36px;height:36px;border-radius:50%;background:var(--bg2);display:grid;place-items:center}
.pill{padding:2px 8px;border-radius:9px;font-size:11px;background:#ffc94a33;color:#ffc94a}.pill.success{background:#f2c14e33;color:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;display:flex;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:22px 22px 0 0;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;font-size:11px;color:var(--mu);font-weight:600;padding:4px}nav button span{display:block;font-size:20px}nav .on{color:var(--ac)}
.md{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.box{background:var(--bg2);border:1px solid var(--bd);border-radius:24px 24px 0 0;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}
.lk{background:radial-gradient(600px 400px at 50% 0,#f2c14e33,var(--bg));position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
.ac{width:min(420px,100%);background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:28px;box-shadow:0 30px 80px #0008}
.logo{font-size:26px;font-weight:900;letter-spacing:-1px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ad{word-break:break-all;font-family:monospace;color:var(--ac)}.er{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
.ck{display:flex;gap:8px;font-size:13px;color:var(--mu);margin:12px 0;align-items:flex-start}.ck input{width:auto;margin-top:3px}
.a{color:var(--ac);cursor:pointer;font-weight:600;font-size:13px}
#toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:#1a1200;padding:10px 18px;border-radius:12px;font-weight:700;z-index:50;display:none;max-width:90%}
.bub{padding:9px 12px;border-radius:14px;margin:6px 0;max-width:85%;font-size:14px}.bot{background:var(--card);border:1px solid var(--bd)}.me{background:var(--ac2);margin-left:auto}
.lg{display:flex;align-items:center;gap:10px}.lg b{font-size:20px;letter-spacing:2px;font-weight:900;display:block;line-height:1.1}.lg b i{font-style:normal;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}.lg img{display:block}
.up{display:grid;grid-template-columns:1fr 1fr;gap:10px}.slot{position:relative;aspect-ratio:4/3;border:2px dashed var(--bd);border-radius:14px;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--mu);cursor:pointer;overflow:hidden;margin:0;padding:0}.slot img{width:100%;height:100%;object-fit:cover}.slot .x{position:absolute;top:6px;right:6px;background:#000b;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;color:#fff}
.demo{background:#f2c14e1f;color:#f2c14e;border:1px dashed #f2c14e66;border-radius:12px;padding:10px;font-size:13px;margin:8px 0;text-align:center}
.ck2 circle,.ck2 path{stroke-dasharray:160;stroke-dashoffset:160;animation:dr .7s ease .1s forwards}.ck2 path{animation-delay:.5s}@keyframes dr{to{stroke-dashoffset:0}}
#splash{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .5s,transform .5s;overflow:hidden}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
#splash:before{content:"";position:absolute;width:520px;height:520px;max-width:120vw;border-radius:50%;background:radial-gradient(circle,#f2c14e40,transparent 65%);animation:gl 3s ease-out both}
.sw{position:relative;display:grid;place-items:center;width:min(340px,86vw);aspect-ratio:1}
.sr{position:absolute;inset:0;border-radius:50%;border:2px dashed #f2c14e66;animation:spin 8s linear infinite,fi .8s ease both}
.sr:after{content:"";position:absolute;inset:16px;border-radius:50%;border:3px solid transparent;border-top-color:#f2c14e;border-bottom-color:#c8921a;animation:spin 1.6s linear infinite reverse}
.sw img{position:relative;width:80%;animation:pop 1.1s cubic-bezier(.2,1.3,.4,1) both,glow 1.4s ease-in-out 1.1s infinite alternate}
.sbar{width:min(220px,60vw);height:4px;border-radius:4px;background:#ffffff18;overflow:hidden}.sbar b{display:block;height:100%;background:linear-gradient(90deg,#c8921a,#f2c14e);animation:bar 2.9s ease-in-out both}
#splash p{margin:0;color:#c8921a;letter-spacing:3px;font-size:11px;font-weight:700;text-transform:uppercase;animation:fi .8s ease 1.2s both}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-14deg);filter:blur(14px)}60%{opacity:1;transform:scale(1.08) rotate(2deg);filter:blur(0)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes glow{from{filter:drop-shadow(0 0 3px #f2c14e44)}to{filter:drop-shadow(0 0 24px #f2c14ecc)}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bar{from{width:0}to{width:100%}}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes gl{0%{opacity:0;transform:scale(.4)}40%{opacity:1}100%{opacity:.8;transform:scale(1.1)}}
#splash:not(.go) *,#splash:not(.go):before{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){#splash *,#splash:before{animation-duration:.01s!important;animation-iteration-count:1!important}}.lg small{letter-spacing:6px;font-size:10px;font-weight:700}.lg.big{flex-direction:column;text-align:center;margin-bottom:8px}.lg.big b{font-size:26px}
.av{border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#000;font-weight:800;display:grid;place-items:center}.avw{position:relative;width:92px;margin:6px auto 10px}.cam{position:absolute;right:-4px;bottom:-4px;width:34px;height:34px;border-radius:50%;background:var(--ac);color:#000;border:3px solid var(--bg);font-size:14px}
